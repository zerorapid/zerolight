name: CI & Registry Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Typecheck, Test, Registry & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Component Registry Build
        run: npm run registry

      - name: TypeScript Static Analysis
        run: npx tsc --noEmit

      - name: Run ZeroLight Automated Invariant Test Suite
        run: npm run test

      - name: Production Next.js Build
        run: npm run build
